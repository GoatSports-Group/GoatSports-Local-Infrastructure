services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: goatsports-jenkins
    restart: unless-stopped

    command:
      - "--httpPort=6060"

    ports:
      - "127.0.0.1:6060:6060"

    mem_limit: 1536m
    cpus: 1.5

    environment:
      JAVA_OPTS: "-Xms256m -Xmx768m"

    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home: