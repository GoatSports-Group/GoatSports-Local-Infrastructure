services:
  auth-service:
    image: minhdat1312/goatsports-auth-service:latest
    container_name: goatsports-auth-service
    ports:
      - "7071:7071"
    environment:
      JAVA_OPTS: "-Xms64m -Xmx128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      SERVER_PORT: ${AUTH_SERVER_PORT}
      DB_URL: ${AUTH_DB_URL}
      STORAGE_SERVICE_URL: ${STORAGE_SERVICE_URL}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_CONSUMER_GROUP_ID: ${AUTH_CONSUMER_GROUP_ID}
      KAFKA_TOPIC_USER_REGISTRATION: ${USER_REGISTRATION_TOPIC}
      KAFKA_TOPIC_USER_SYNC: ${USER_SYNC_TOPIC}
      KAFKA_TOPIC_USER_LOG: ${KAFKA_TOPIC_USER_LOG}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED}
      EUREKA_DISCOVERY_ENABLED: ${EUREKA_DISCOVERY_ENABLED}
      EUREKA_SERVICE_URL: ${EUREKA_SERVICE_URL}
      EUREKA_SERVICE_PREFER_IP_ADDRESS: ${EUREKA_SERVICE_PREFER_IP_ADDRESS_CLIENT}
      KEYCLOAK_TOKEN_URI: ${KEYCLOAK_TOKEN_URI}
      KEYCLOAK_LOGOUT_URI: ${KEYCLOAK_LOGOUT_URI}
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL}
      KEYCLOAK_CALLBACK_URL: ${KEYCLOAK_CALLBACK_URL}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_REALM_MASTER: ${KEYCLOAK_REALM_MASTER}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_CURRENT_REALM: ${KEYCLOAK_CURRENT_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION_SECOND: ${JWT_ACCESS_TOKEN_EXPIRATION_SECOND}
      JWT_REFRESH_TOKEN_EXPIRATION_SECOND: ${JWT_REFRESH_TOKEN_EXPIRATION_SECOND}
      VERIFICATION_CODE_VALIDITY_IN_SECOND: ${VERIFICATION_CODE_VALIDITY_IN_SECOND}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      COOKIE_SECURE: ${COOKIE_SECURE}
      PORT_MAIL: ${PORT_MAIL}
      USERNAME_MAIL: ${USERNAME_MAIL}
      PASSWORD_MAIL: ${PASSWORD_MAIL}
      CLIENT_FRONTEND_URL: ${CLIENT_FRONTEND_URL}
      ADMIN_FRONTEND_URL: ${ADMIN_FRONTEND_URL}
    networks:
      goatsports-network:
        aliases:
          - auth-service

  venue-service:
    image: minhdat1312/goatsports-venue-service:latest
    container_name: goatsports-venue-service
    ports:
      - "7072:7072"
    environment:
      JAVA_OPTS: "-Xms64m -Xmx128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      SERVER_PORT: ${VENUE_SERVER_PORT}
      DB_URL: ${VENUE_DB_URL}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED}
      EUREKA_DISCOVERY_ENABLED: ${EUREKA_DISCOVERY_ENABLED}
      EUREKA_SERVICE_URL: ${EUREKA_SERVICE_URL}
      EUREKA_SERVICE_PREFER_IP_ADDRESS: ${EUREKA_SERVICE_PREFER_IP_ADDRESS_CLIENT}
      STORAGE_SERVICE_URL: ${STORAGE_SERVICE_URL}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_USER_LOG: ${KAFKA_TOPIC_USER_LOG}
      PAYMENT_EVENTS_CONSUMER_ENABLED: ${PAYMENT_EVENTS_CONSUMER_ENABLED}
      PAYMENT_EVENTS_TOPIC: ${PAYMENT_EVENTS_TOPIC}
      PAYMENT_EVENTS_VENUE_GROUP_ID: ${PAYMENT_EVENTS_VENUE_GROUP_ID}
      BOOKING_PAYMENT_HOLD_DURATION: ${BOOKING_PAYMENT_HOLD_DURATION}
      BOOKING_PAYMENT_HOLD_EXPIRATION_ENABLED: ${BOOKING_PAYMENT_HOLD_EXPIRATION_ENABLED}
      BOOKING_PAYMENT_HOLD_EXPIRATION_SCAN_MS: ${BOOKING_PAYMENT_HOLD_EXPIRATION_SCAN_MS}
      MAX_PART_COUNT: ${MAX_PART_COUNT}
    networks:
      goatsports-network:
        aliases:
          - venue-service

  notification-service:
    image: minhdat1312/goatsports-notification-service:latest
    container_name: goatsports-notification-service
    ports:
      - "7073:7073"
    environment:
      JAVA_OPTS: "-Xms64m -Xmx128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      SERVER_PORT: ${NOTIFICATION_SERVICE_PORT}
      DB_URL: ${NOTIFICATION_DB_URL}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED}
      EUREKA_DISCOVERY_ENABLED: ${EUREKA_DISCOVERY_ENABLED}
      EUREKA_SERVICE_URL: ${EUREKA_SERVICE_URL}
      EUREKA_SERVICE_PREFER_IP_ADDRESS: ${EUREKA_SERVICE_PREFER_IP_ADDRESS_CLIENT}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_CONSUMER_GROUP_ID: ${NOTIFICATION_CONSUMER_GROUP_ID}
      KAFKA_TOPIC_USER_LOG: ${KAFKA_TOPIC_USER_LOG}
    networks:
      goatsports-network:
        aliases:
          - notification-service

  report-service:
    image: minhdat1312/goatsports-report-service:latest
    container_name: goatsports-report-service
    ports:
      - "7074:7074"
    environment:
      JAVA_OPTS: "-Xms64m -Xmx128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      SERVER_PORT: ${REPORT_SERVICE_PORT}
      DB_URL_AUTH: ${AUTH_DB_URL}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      VENUE_SERVICE_URL: ${VENUE_SERVICE_URL}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED}
      EUREKA_DISCOVERY_ENABLED: ${EUREKA_DISCOVERY_ENABLED}
      EUREKA_SERVICE_URL: ${EUREKA_SERVICE_URL}
      EUREKA_SERVICE_PREFER_IP_ADDRESS: ${EUREKA_SERVICE_PREFER_IP_ADDRESS_CLIENT}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_USER_LOG: ${KAFKA_TOPIC_USER_LOG}
    networks:
      goatsports-network:
        aliases:
          - report-service

  storage-service:
    image: minhdat1312/goatsports-storage-service:latest
    container_name: goatsports-storage-service
    ports:
      - "7075:7075"
    environment:
      JAVA_OPTS: "-Xms64m -Xmx128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      SERVER_PORT: ${STORAGE_SERVICE_PORT}
      JWT_SECRET: ${JWT_SECRET}
      CLOUDFLARE_R2_ACCESS_KEY: ${CLOUDFLARE_R2_ACCESS_KEY}
      CLOUDFLARE_R2_SECRET_KEY: ${CLOUDFLARE_R2_SECRET_KEY}
      CLOUDFLARE_R2_ENDPOINT: ${CLOUDFLARE_R2_ENDPOINT}
      CLOUDFLARE_R2_PUBLIC_DOMAIN: ${CLOUDFLARE_R2_PUBLIC_DOMAIN}
      CLOUDFLARE_R2_EXPIRATION_MINUTES: ${CLOUDFLARE_R2_EXPIRATION_MINUTES}
      CLOUDFLARE_R2_BUCKET: ${CLOUDFLARE_R2_BUCKET}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_CONSUMER_GROUP_ID: ${STORAGE_CONSUMER_GROUP_ID}
      KAFKA_TOPIC_FILE_MOVE: ${FILE_MOVE_TOPIC}
      KAFKA_TOPIC_FILE_MOVE_COMPLETED: ${FILE_MOVE_COMPLETED_TOPIC}
      KAFKA_TOPIC_USER_LOG: ${KAFKA_TOPIC_USER_LOG}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED}
      EUREKA_DISCOVERY_ENABLED: ${EUREKA_DISCOVERY_ENABLED}
      EUREKA_SERVICE_URL: ${EUREKA_SERVICE_URL}
      EUREKA_SERVICE_PREFER_IP_ADDRESS: ${EUREKA_SERVICE_PREFER_IP_ADDRESS_CLIENT}
    networks:
      goatsports-network:
        aliases:
          - storage-service

  workflow-service:
    image: minhdat1312/goatsports-workflow-service:latest
    container_name: goatsports-workflow-service
    deploy:
      resources:
        limits:
          memory: 320M
    ports:
      - "7076:7076"
    environment:
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      SERVER_PORT: ${WORKFLOW_SERVICE_PORT}
      CAMUNDA_CLIENT_MODE: ${CAMUNDA_CLIENT_MODE}
      CAMUNDA_CLIENT_ZEEBE_GRPCADDRESS: ${CAMUNDA_CLIENT_ZEEBE_GRPCADDRESS}
      CAMUNDA_CLIENT_ZEEBE_RESTADDRESS: ${CAMUNDA_CLIENT_ZEEBE_RESTADDRESS}
      CAMUNDA_CLIENT_ZEEBE_ENABLED: "true"
      CAMUNDA_CLIENT_AUTH_USERNAME: ${CAMUNDA_CLIENT_AUTH_USERNAME}
      CAMUNDA_CLIENT_AUTH_PASSWORD: ${CAMUNDA_CLIENT_AUTH_PASSWORD}
      CAMUNDA_CONNECT_TIMEOUT: ${CAMUNDA_CONNECT_TIMEOUT}
      CAMUNDA_REQUEST_TIMEOUT: ${CAMUNDA_REQUEST_TIMEOUT}
      CAMUNDA_WORKER_REQUEST_TIMEOUT: ${CAMUNDA_WORKER_REQUEST_TIMEOUT}
      CAMUNDA_EXECUTION_THREADS: ${CAMUNDA_EXECUTION_THREADS}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      VENUE_SERVICE_URL: ${VENUE_SERVICE_URL}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      STORAGE_SERVICE_URL: ${STORAGE_SERVICE_URL}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED}
      EUREKA_DISCOVERY_ENABLED: ${EUREKA_DISCOVERY_ENABLED}
      EUREKA_SERVICE_URL: ${EUREKA_SERVICE_URL}
      EUREKA_SERVICE_PREFER_IP_ADDRESS: ${EUREKA_SERVICE_PREFER_IP_ADDRESS_CLIENT}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_CONSUMER_GROUP_ID: ${WORKFLOW_CONSUMER_GROUP_ID}
      KAFKA_TOPIC_FILE_MOVE_COMPLETED: ${FILE_MOVE_COMPLETED_TOPIC}
      KAFKA_TOPIC_USER_LOG: ${KAFKA_TOPIC_USER_LOG}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      goatsports-network:
        aliases:
          - workflow-service

  audit-service:
    image: minhdat1312/goatsports-audit-service:latest
    container_name: goatsports-audit-service
    ports:
      - "7077:7077"
    environment:
      JAVA_OPTS: "-Xms64m -Xmx128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      SERVER_PORT: ${AUDIT_SERVER_PORT}
      MONGODB_URI: ${MONGODB_URI}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      AUDIT_CONSUMER_GROUP_ID: ${AUDIT_CONSUMER_GROUP_ID}
      KAFKA_TOPIC_USER_LOG: ${KAFKA_TOPIC_USER_LOG}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED}
      EUREKA_DISCOVERY_ENABLED: ${EUREKA_DISCOVERY_ENABLED}
      EUREKA_SERVICE_URL: ${EUREKA_SERVICE_URL}
      EUREKA_SERVICE_PREFER_IP_ADDRESS: ${EUREKA_SERVICE_PREFER_IP_ADDRESS_CLIENT}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      goatsports-network:
        aliases:
          - audit-service

  payment-service:
    image: minhdat1312/goatsports-payment-service:latest
    container_name: goatsports-payment-service
    ports:
      - "7078:7078"
    environment:
      JAVA_OPTS: "-Xms64m -Xmx128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      SERVER_PORT: ${PAYMENT_SERVICE_PORT}
      DB_URL: ${PAYMENT_DB_URL}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED}
      EUREKA_DISCOVERY_ENABLED: ${EUREKA_DISCOVERY_ENABLED}
      EUREKA_SERVICE_URL: ${EUREKA_SERVICE_URL}
      EUREKA_SERVICE_PREFER_IP_ADDRESS: ${EUREKA_SERVICE_PREFER_IP_ADDRESS_CLIENT}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_USER_LOG: ${KAFKA_TOPIC_USER_LOG}
      PAYMENT_EVENTS_TOPIC: ${PAYMENT_EVENTS_TOPIC}
      PAYMENT_EVENTS_PUBLISHER_ENABLED: ${PAYMENT_EVENTS_PUBLISHER_ENABLED}
      PAYMENT_EVENTS_SEND_TIMEOUT_SECONDS: ${PAYMENT_EVENTS_SEND_TIMEOUT_SECONDS}
      PAYOS_ENABLED: ${PAYOS_ENABLED}
      PAYOS_API_URL: ${PAYOS_API_URL}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID}
      PAYOS_API_KEY: ${PAYOS_API_KEY}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY}
      PAYOS_WEBHOOK_URL: ${PAYOS_WEBHOOK_URL}
      PAYOS_RETURN_URL: ${PAYOS_RETURN_URL}
      PAYOS_CANCEL_URL: ${PAYOS_CANCEL_URL}
      PAYOS_TIMEOUT_MS: ${PAYOS_TIMEOUT_MS}
      PAYOS_MAX_RETRIES: ${PAYOS_MAX_RETRIES}
      PAYOS_REGISTER_WEBHOOK_ON_STARTUP: ${PAYOS_REGISTER_WEBHOOK_ON_STARTUP}
    networks:
      goatsports-network:
        aliases:
          - payment-service

networks:
  goatsports-network:
    external: true
