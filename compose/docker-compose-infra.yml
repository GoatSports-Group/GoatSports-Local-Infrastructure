services:
  postgres:
    image: postgres:16
    container_name: goatsports-postgres
    deploy:
      resources:
        limits:
          memory: 512M
    entrypoint: [ "sh", "-c", "echo 'CREATE DATABASE keycloak; CREATE DATABASE sports_auth; CREATE DATABASE sports_venue; CREATE DATABASE sports_notification; CREATE DATABASE sports_payment;' > /docker-entrypoint-initdb.d/init.sql && exec /usr/local/bin/docker-entrypoint.sh postgres" ]
    command: [ "-c", "max_connections=15", "-c", "shared_buffers=16MB", "-c", "work_mem=1MB" ]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      goatsports-network:
        aliases:
          - postgres

  mongodb:
    image: mongo:7
    container_name: goatsports-mongodb
    deploy:
      resources:
        limits:
          memory: 256M
    command: [ "mongod", "--wiredTigerCacheSizeGB", "0.25" ]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - mongodb_data:/data/db
    networks:
      goatsports-network:
        aliases:
          - mongodb

  redis:
    image: redis:7-alpine
    container_name: goatsports-redis
    deploy:
      resources:
        limits:
          memory: 96M
    command: [ "redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no", "--save", "" ]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      goatsports-network:
        aliases:
          - redis

  kafka:
    image: apache/kafka:latest
    container_name: goatsports-kafka
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "9092:9092"
    environment:
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: 'INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:19092,EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@127.0.0.1:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    deploy:
      resources:
        limits:
          memory: 384M
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      goatsports-network:
        aliases:
          - kafka

  eureka-server:
    image: minhdat1312/goatsports-eureka-server:latest
    container_name: goatsports-eureka-server
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent localhost:8761/actuator/health/readiness | grep UP || exit 1" ]
      start_period: 20s
      retries: 10
      timeout: 5s
      interval: 10s
    ports:
      - "8761:8761"
    environment:
      JAVA_OPTS: "-Xms64m -Xmx160m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
      SERVER_PORT: ${EUREKA_SERVER_PORT}
      EUREKA_INSTANCE_HOSTNAME: ${EUREKA_INSTANCE_HOSTNAME}
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      EUREKA_SERVER_ENABLE_SELF_PRESERVATION: "true"
    networks:
      goatsports-network:
        aliases:
          - eureka-server

  ollama:
    image: ollama/ollama:latest
    container_name: goatsports-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      goatsports-network:
        aliases:
          - ollama

volumes:
  kafka_data:
    name: goatsports_kafka_data
  postgres_data:
    name: goatsports_postgres_data
  redis_data:
    name: goatsports_redis_data
  mongodb_data:
    name: goatsports_mongodb_data
  ollama_data:
    name: goatsports_ollama_data

networks:
  goatsports-network:
    external: true
