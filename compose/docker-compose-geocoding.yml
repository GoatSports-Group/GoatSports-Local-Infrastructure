services:
  nominatim:
    image: mediagis/nominatim:5.3
    container_name: goatsports-nominatim
    shm_size: 1gb
    ports:
      - "8090:8080"
    environment:
      PBF_URL: https://download.geofabrik.de/asia/vietnam-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/asia/vietnam-updates/
      UPDATE_MODE: ${NOMINATIM_UPDATE_MODE}
      IMPORT_WIKIPEDIA: "false"
      NOMINATIM_PASSWORD: ${NOMINATIM_PASSWORD}
    volumes:
      - nominatim_data:/var/lib/postgresql/16/main
    restart: unless-stopped
    networks:
      goatsports-network:
        aliases:
          - nominatim

volumes:
  nominatim_data:
    name: goatsports_nominatim_data

networks:
  goatsports-network:
    external: true
