storage:
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.5

net:
  port: 27017
  bindIpAll: true

replication:
  replSetName: rs0

security:
  authorization: enabled
  keyFile: /run/secrets/mongodb/keyfile

setParameter:
  searchIndexManagementHostAndPort: mongodb-search-engine:27028
  mongotHost: mongodb-search-engine:27028
  skipAuthenticationToSearchIndexManagementServer: false
  useGrpcForSearch: true
  searchTLSMode: disabled

