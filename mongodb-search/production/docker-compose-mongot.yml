services:
  mongot:
    image: mongodb/mongodb-community-search:1.70.3
    container_name: goatsports-mongot
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/lib/goatsports/mongot:/data/mongot
      - ./config/mongot.yml:/mongot-community/config.default.yml:ro
      - /etc/goatsports/mongot/secrets:/run/secrets/mongot:ro
      - /etc/goatsports/mongot/tls:/run/tls/mongot:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
