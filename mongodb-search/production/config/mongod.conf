storage:
  dbPath: /data/db

net:
  port: 27017
  bindIpAll: true
  tls:
    mode: requireTLS
    certificateKeyFile: /run/tls/mongodb/mongodb.pem
    CAFile: /run/tls/mongodb/ca.pem
    allowConnectionsWithoutCertificates: true

replication:
  replSetName: rs0

security:
  authorization: enabled
  keyFile: /run/secrets/mongodb/keyfile

setParameter:
  searchIndexManagementHostAndPort: search-lb.internal:27028
  mongotHost: search-lb.internal:27028
  skipAuthenticationToSearchIndexManagementServer: false
  useGrpcForSearch: true