services:
  kafka:
    image: apache/kafka:latest
    container_name: goatsports-kafka
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: 'INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'INTERNAL://kafka:19092,EXTERNAL://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - goatsports-network

  keycloak:
    image: minhdat1312/goatsports-keycloak:latest
    container_name: goatsports-keycloak
    deploy:
      resources:
        limits:
          memory: 750M
    command: [ "start", "--optimized", "--hostname=${KEYCLOAK_SERVER_URL}", "--hostname-admin=${KEYCLOAK_SERVER_URL}", "--proxy-headers=xforwarded" ]
    healthcheck:
      test: [ "CMD-SHELL", "curl --head -fsS http://localhost:9000/health/ready | echo $?" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    ports:
      - "8082:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: ${KC_DB_URL}
      KC_DB_USERNAME: ${KC_DB_USERNAME}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KAFKA_BOOTSTRAP_SERVER: ${KAFKA_BOOTSTRAP_SERVER}
      KEYCLOAK_KAFKA_CONSUME_TOPIC: ${USER_REGISTRATION_TOPIC}
      KEYCLOAK_KAFKA_PRODUCE_TOPIC: ${USER_SYNC_TOPIC}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KC_METRICS_ENABLED: "true"
      KC_HTTP_HEALTH_PORT: "9000"
      QUARKUS_TRANSACTION_MANAGER_DEFAULT_TRANSACTION_TIMEOUT: 900
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_SERVER_URL}
      KC_HOSTNAME_ADMIN: ${KEYCLOAK_SERVER_URL}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    networks:
      - goatsports-network

  eureka-server:
    image: minhdat1312/goatsports-eureka-server:latest
    container_name: goatsports-eureka-server
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent localhost:8761/actuator/health/readiness | grep UP || exit 1" ]
      start_period: 10s
      retries: 10
      timeout: 5s
      interval: 10s
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: ${EUREKA_SERVER_PORT}
      EUREKA_INSTANCE_HOSTNAME: ${EUREKA_INSTANCE_HOSTNAME}
    networks:
      - goatsports-network

  gateway-server:
    image: minhdat1312/goatsports-gateway:latest
    container_name: goatsports-gateway
    deploy:
      resources:
        limits:
          memory: 320M
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl --silent localhost:7070/ | grep -q 'statusCode' || exit 1" ]
      start_period: 10s
      retries: 10
      timeout: 5s
      interval: 10s
    ports:
      - "7070:7070"
    environment:
      SERVER_PORT: ${GATEWAY_SERVER_PORT}
      HTTP_CODECS_MAX_IN_MEMORY_SIZE: ${HTTP_CODECS_MAX_IN_MEMORY_SIZE}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      VENUE_SERVICE_URL: ${VENUE_SERVICE_URL}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      REPORT_SERVICE_URL: ${REPORT_SERVICE_URL}
      STORAGE_SERVICE_URL: ${STORAGE_SERVICE_URL}
      WORKFLOW_SERVICE_URL: ${WORKFLOW_SERVICE_URL}
      AUDIT_SERVICE_URL: ${AUDIT_SERVICE_URL}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED}
      EUREKA_DISCOVERY_ENABLED: ${EUREKA_DISCOVERY_ENABLED}
      EUREKA_SERVICE_URL: ${EUREKA_SERVICE_URL}
      EUREKA_SERVICE_PREFER_IP_ADDRESS: ${EUREKA_SERVICE_PREFER_IP_ADDRESS}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      REDIS_URL: ${REDIS_URL}
    networks:
      - goatsports-network

  auth-service:
    image: minhdat1312/goatsports-auth-service:latest
    container_name: goatsports-auth-service
    ports:
      - "7071:7071"
    environment:
      SERVER_PORT: ${AUTH_SERVER_PORT}
      DB_URL: ${AUTH_DB_URL}
      STORAGE_SERVICE_URL: ${STORAGE_SERVICE_URL}
      REDIS_URL: ${REDIS_URL}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_CONSUMER_GROUP_ID: ${AUTH_CONSUMER_GROUP_ID}
      KAFKA_TOPIC_USER_REGISTRATION: ${USER_REGISTRATION_TOPIC}
      KAFKA_TOPIC_USER_SYNC: ${USER_SYNC_TOPIC}
      KAFKA_TOPIC_USER_LOG: ${KAFKA_TOPIC_USER_LOG}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED}
      EUREKA_DISCOVERY_ENABLED: ${EUREKA_DISCOVERY_ENABLED}
      EUREKA_SERVICE_URL: ${EUREKA_SERVICE_URL}
      EUREKA_SERVICE_PREFER_IP_ADDRESS: ${EUREKA_SERVICE_PREFER_IP_ADDRESS_CLIENT}
      KEYCLOAK_TOKEN_URI: ${KEYCLOAK_TOKEN_URI}
      KEYCLOAK_LOGOUT_URI: ${KEYCLOAK_LOGOUT_URI}
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL}
      KEYCLOAK_CALLBACK_URL: ${KEYCLOAK_CALLBACK_URL}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_REALM_MASTER: ${KEYCLOAK_REALM_MASTER}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_CURRENT_REALM: ${KEYCLOAK_CURRENT_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION_SECOND: ${JWT_ACCESS_TOKEN_EXPIRATION_SECOND}
      JWT_REFRESH_TOKEN_EXPIRATION_SECOND: ${JWT_REFRESH_TOKEN_EXPIRATION_SECOND}
      VERIFICATION_CODE_VALIDITY_IN_SECOND: ${VERIFICATION_CODE_VALIDITY_IN_SECOND}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      COOKIE_SECURE: ${COOKIE_SECURE}
      PORT_MAIL: ${PORT_MAIL}
      USERNAME_MAIL: ${USERNAME_MAIL}
      PASSWORD_MAIL: ${PASSWORD_MAIL}
      CLIENT_FRONTEND_URL: ${CLIENT_FRONTEND_URL}
      ADMIN_FRONTEND_URL: ${ADMIN_FRONTEND_URL}
    networks:
      - goatsports-network

  venue-service:
    image: minhdat1312/goatsports-venue-service:latest
    container_name: goatsports-venue-service
    ports:
      - "7072:7072"
    environment:
      SERVER_PORT: ${VENUE_SERVER_PORT}
      DB_URL: ${VENUE_DB_URL}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED}
      EUREKA_DISCOVERY_ENABLED: ${EUREKA_DISCOVERY_ENABLED}
      EUREKA_SERVICE_URL: ${EUREKA_SERVICE_URL}
      EUREKA_SERVICE_PREFER_IP_ADDRESS: ${EUREKA_SERVICE_PREFER_IP_ADDRESS_CLIENT}
      STORAGE_SERVICE_URL: ${STORAGE_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_USER_LOG: ${KAFKA_TOPIC_USER_LOG}
      MAX_PART_COUNT: ${MAX_PART_COUNT}
    networks:
      - goatsports-network

  notification-service:
    image: minhdat1312/goatsports-notification-service:latest
    container_name: goatsports-notification-service
    ports:
      - "7073:7073"
    environment:
      SERVER_PORT: ${NOTIFICATION_SERVICE_PORT}
      DB_URL: ${NOTIFICATION_DB_URL}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED}
      EUREKA_DISCOVERY_ENABLED: ${EUREKA_DISCOVERY_ENABLED}
      EUREKA_SERVICE_URL: ${EUREKA_SERVICE_URL}
      EUREKA_SERVICE_PREFER_IP_ADDRESS: ${EUREKA_SERVICE_PREFER_IP_ADDRESS_CLIENT}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_CONSUMER_GROUP_ID: ${NOTIFICATION_CONSUMER_GROUP_ID}
      KAFKA_TOPIC_USER_LOG: ${KAFKA_TOPIC_USER_LOG}
    networks:
      - goatsports-network

  report-service:
    image: minhdat1312/goatsports-report-service:latest
    container_name: goatsports-report-service
    ports:
      - "7074:7074"
    environment:
      SERVER_PORT: ${REPORT_SERVICE_PORT}
      DB_URL_AUTH: ${AUTH_DB_URL}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED}
      EUREKA_DISCOVERY_ENABLED: ${EUREKA_DISCOVERY_ENABLED}
      EUREKA_SERVICE_URL: ${EUREKA_SERVICE_URL}
      EUREKA_SERVICE_PREFER_IP_ADDRESS: ${EUREKA_SERVICE_PREFER_IP_ADDRESS_CLIENT}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC_USER_LOG: ${KAFKA_TOPIC_USER_LOG}
    networks:
      - goatsports-network

  storage-service:
    image: minhdat1312/goatsports-storage-service:latest
    container_name: goatsports-storage-service
    ports:
      - "7075:7075"
    environment:
      SERVER_PORT: ${STORAGE_SERVICE_PORT}
      JWT_SECRET: ${JWT_SECRET}
      CLOUDFLARE_R2_ACCESS_KEY: ${CLOUDFLARE_R2_ACCESS_KEY}
      CLOUDFLARE_R2_SECRET_KEY: ${CLOUDFLARE_R2_SECRET_KEY}
      CLOUDFLARE_R2_ENDPOINT: ${CLOUDFLARE_R2_ENDPOINT}
      CLOUDFLARE_R2_PUBLIC_DOMAIN: ${CLOUDFLARE_R2_PUBLIC_DOMAIN}
      CLOUDFLARE_R2_EXPIRATION_MINUTES: ${CLOUDFLARE_R2_EXPIRATION_MINUTES}
      CLOUDFLARE_R2_BUCKET: ${CLOUDFLARE_R2_BUCKET}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_CONSUMER_GROUP_ID: ${STORAGE_CONSUMER_GROUP_ID}
      KAFKA_TOPIC_FILE_MOVE: ${FILE_MOVE_TOPIC}
      KAFKA_TOPIC_FILE_MOVE_COMPLETED: ${FILE_MOVE_COMPLETED_TOPIC}
      KAFKA_TOPIC_USER_LOG: ${KAFKA_TOPIC_USER_LOG}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED}
      EUREKA_DISCOVERY_ENABLED: ${EUREKA_DISCOVERY_ENABLED}
      EUREKA_SERVICE_URL: ${EUREKA_SERVICE_URL}
      EUREKA_SERVICE_PREFER_IP_ADDRESS: ${EUREKA_SERVICE_PREFER_IP_ADDRESS_CLIENT}
    networks:
      - goatsports-network

  workflow-service:
    image: minhdat1312/goatsports-workflow-service:latest
    container_name: goatsports-workflow-service
    ports:
      - "7076:7076"
    environment:
      SERVER_PORT: ${WORKFLOW_SERVICE_PORT}
      CAMUNDA_CLIENT_MODE: ${CAMUNDA_CLIENT_MODE}
      CAMUNDA_CLUSTER_ID: ${CAMUNDA_CLUSTER_ID}
      CAMUNDA_CLUSTER_REGION: ${CAMUNDA_CLUSTER_REGION}
      CAMUNDA_CLIENT_ID: ${CAMUNDA_CLIENT_ID}
      CAMUNDA_CLIENT_SECRET: ${CAMUNDA_CLIENT_SECRET}
      CAMUNDA_CONNECT_TIMEOUT: ${CAMUNDA_CONNECT_TIMEOUT}
      CAMUNDA_REQUEST_TIMEOUT: ${CAMUNDA_REQUEST_TIMEOUT}
      CAMUNDA_WORKER_REQUEST_TIMEOUT: ${CAMUNDA_WORKER_REQUEST_TIMEOUT}
      CAMUNDA_EXECUTION_THREADS: ${CAMUNDA_EXECUTION_THREADS}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      VENUE_SERVICE_URL: ${VENUE_SERVICE_URL}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
      STORAGE_SERVICE_URL: ${STORAGE_SERVICE_URL}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED}
      EUREKA_DISCOVERY_ENABLED: ${EUREKA_DISCOVERY_ENABLED}
      EUREKA_SERVICE_URL: ${EUREKA_SERVICE_URL}
      EUREKA_SERVICE_PREFER_IP_ADDRESS: ${EUREKA_SERVICE_PREFER_IP_ADDRESS_CLIENT}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_CONSUMER_GROUP_ID: ${WORKFLOW_CONSUMER_GROUP_ID}
      KAFKA_TOPIC_FILE_MOVE_COMPLETED: ${FILE_MOVE_COMPLETED_TOPIC}
      KAFKA_TOPIC_USER_LOG: ${KAFKA_TOPIC_USER_LOG}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - goatsports-network

  audit-service:
    image: minhdat1312/goatsports-audit-service:latest
    container_name: goatsports-audit-service
    ports:
      - "7077:7077"
    environment:
      SERVER_PORT: ${AUDIT_SERVER_PORT}
      MONGODB_URI: ${MONGODB_URI}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      AUDIT_CONSUMER_GROUP_ID: ${AUDIT_CONSUMER_GROUP_ID}
      KAFKA_TOPIC_USER_LOG: ${KAFKA_TOPIC_USER_LOG}
      EUREKA_CLIENT_ENABLED: ${EUREKA_CLIENT_ENABLED}
      EUREKA_DISCOVERY_ENABLED: ${EUREKA_DISCOVERY_ENABLED}
      EUREKA_SERVICE_URL: ${EUREKA_SERVICE_URL}
      EUREKA_SERVICE_PREFER_IP_ADDRESS: ${EUREKA_SERVICE_PREFER_IP_ADDRESS_CLIENT}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - goatsports-network

volumes:
  kafka_data:

networks:
  goatsports-network:
    external: true
